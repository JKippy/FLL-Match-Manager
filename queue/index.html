<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>Match queue</title>
<style>
  :root { --fg:#fff; --run:#3ddc84; --warn:#ffc400; --dim:#8a8f98; --blue:#4c8dff; --card:#111418; --brk:#ff9a2e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#000; color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  html { height:100%; }
  body { min-height:100%; display:flex; flex-direction:column; }
  body.onbreak { height:100%; overflow:hidden; }
  body.onbreak main { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  body.nature { background:radial-gradient(ellipse 90% 60% at 50% 115%, #0c2a18 0%, #05140c 45%, #000 85%); --card:rgba(14,24,19,.92); }
  header { display:flex; align-items:center; gap:.6em; padding:max(12px, env(safe-area-inset-top)) 16px 8px; position:sticky; top:0; z-index:2;
    background:rgba(0,0,0,.92); font-size:clamp(15px, 3.4vw, 28px); color:var(--dim); min-width:0; overflow:hidden; }
  #name { color:#fff; font-weight:800; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #updated { margin-left:auto; flex:none; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; font-size:.85em; }
  #updated.stale { color:var(--warn); }
  .dot { width:.7em; height:.7em; border-radius:50%; background:#ff3b30; flex:none; }
  .dot.ok { background:var(--run); } .dot.wait { background:var(--warn); }
  main { padding:8px 14px max(18px, env(safe-area-inset-bottom)); }
  .queue { display:flex; flex-direction:column; gap:12px; }
  .qbox, .qcard { background:var(--card); border:2px solid #1f242b; border-radius:16px; }
  body.nature .qbox, body.nature .qcard { border-color:#1d3326; }
  .qnow { display:flex; align-items:center; gap:.7em; flex-wrap:wrap; padding:12px 14px; font-size:clamp(16px, 4vw, 28px); }
  .qnow .k { font-weight:900; letter-spacing:.14em; color:var(--run); text-transform:uppercase; font-size:.72em; }
  .qnow .k.brk { color:var(--brk); } .qnow .k.dim { color:var(--dim); }
  .qnow .clock { margin-left:auto; font-weight:900; font-variant-numeric:tabular-nums; }
  .qnext { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .qcard { border-width:3px; padding:12px 14px; min-width:0; }
  .qcard.first { border-color:var(--blue); }
  .qhead { display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap; font-size:clamp(22px, 5vw, 40px); font-weight:800; }
  .qhead .k { font-size:.42em; letter-spacing:.16em; color:var(--blue); text-transform:uppercase; font-weight:900; }
  .qcard:not(.first) .qhead .k { color:var(--dim); }
  .qhead .tm { margin-left:auto; color:#cfd4da; font-size:.55em; font-weight:700; }
  .qhead .pr { color:var(--dim); font-size:.4em; font-weight:800; letter-spacing:.08em; }
  .qrow { display:flex; align-items:baseline; gap:.6em; font-size:clamp(15px, 3.6vw, 22px); border-top:1px solid #1f242b; padding:8px 0; min-width:0; }
  .qrow:first-child { border-top:0; }
  .qrow .qt { color:var(--dim); font-weight:800; text-transform:uppercase; letter-spacing:.04em; min-width:4.6em; }
  .qrow .qn { font-size:1.55em; font-weight:900; font-variant-numeric:tabular-nums; }
  .qrow .qname { color:#cfd4da; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .qqueue { padding:10px 14px; font-size:clamp(14px, 3.4vw, 20px); }
  .qqueue .k { color:var(--warn); font-weight:900; letter-spacing:.12em; text-transform:uppercase; margin-right:.5em; font-size:.8em; }
  .qqueue .ln { display:flex; gap:.7em; flex-wrap:wrap; align-items:baseline; padding:4px 0; }
  .qqueue .ln b { min-width:6.5em; }
  .qqueue .tm2 { color:var(--dim); }
  .brkpill { display:inline-block; background:var(--brk); color:#1c0e00; font-weight:900; letter-spacing:.14em; text-transform:uppercase; padding:.2em .9em; border-radius:999px; font-size:clamp(18px, 5vw, 40px); }
  .qbreak { align-items:stretch; justify-content:center; text-align:center; width:100%; flex:1; min-height:0; }
  .qbreak-card { display:flex; flex-direction:column; align-items:center; gap:8px; padding:4px 0; width:100%; }
  .qbreak-top { display:flex; align-items:center; justify-content:center; gap:.6em; width:100%; }
  .qbreak-on { font-size:clamp(36px, 6.6vw, 112px); font-weight:900; line-height:1; white-space:nowrap; }
  .qtime { font-size:clamp(52px, 10vw, 160px); font-weight:900; color:var(--brk); font-variant-numeric:tabular-nums; line-height:.9; }
  .brksub { font-size:clamp(16px, 2.2vw, 32px); font-weight:700; }
  .qbreak .brksub { white-space:nowrap; }
  .qback { width:100%; margin-top:10px; text-align:left; min-width:0; }
  .qback-k { text-align:center; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--warn); font-size:clamp(13px, 1.8vw, 22px); }
  .qback-match { text-align:center; font-weight:900; font-size:clamp(24px, 3.4vw, 48px); margin:2px 0 6px; }
  .qback-teams { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:4px 16px; }
  .qbreak .qrow { border-top:0; padding:2px 0; }
  .qbreak .qname { flex:1 1 auto; min-width:0; color:#cfd4da; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow-wrap:anywhere; white-space:normal; }
  .muted { color:var(--dim); }
  .waiting { padding:18vh 10px; text-align:center; color:var(--dim); font-size:18px; }
  #nxqr { background:#fff; color:#111; border-radius:18px; padding:12px 12px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;
    width:min(42vh, 28vw, 440px); max-height:100%; box-sizing:border-box; }
  #nxqr { overflow:hidden; }
  #nxqr canvas { width:100%; height:auto; aspect-ratio:1; display:block; background:#fff; image-rendering:pixelated; }
  #nxqrLabel { color:#111; font-weight:800; text-align:center; font-size:clamp(13px, 1.8vw, 22px); line-height:1.15; }
  body.has-qr { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto minmax(0,1fr); height:100%; min-height:0; overflow:hidden; }
  body.has-qr .queue { gap:8px; }
  body.has-qr .qrow { padding:4px 0; }
  body.has-qr main { padding-top:4px; padding-bottom:8px; }
  body.has-qr header { grid-column:1 / -1; grid-row:1; }
  body.has-qr main { grid-column:1; grid-row:2; min-width:0; min-height:0; }
  body.has-qr #nxqr { grid-column:2; grid-row:2; align-self:center; margin:8px 14px 8px 0; }
  body.onbreak.has-qr { height:100%; overflow:hidden; }
  @media (max-width: 800px) {
    .qnext { grid-template-columns:1fr; }
    .qhead { font-size:22px; }
    /* Phone: one short row, code beside its label, so the match list keeps the width of the screen. */
    body.has-qr { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); }
    body.has-qr #nxqr { grid-column:1; grid-row:2; width:auto; max-width:calc(100% - 16px); flex-direction:row; align-items:center; justify-self:end; margin:2px 8px 0 0; padding:4px 8px 4px 4px; gap:6px; }
    body.has-qr #nxqr canvas { width:104px; height:104px; }
    body.has-qr #nxqrLabel { font-size:12px; line-height:1.15; max-width:9em; text-align:left; }
    body.has-qr main { grid-column:1; grid-row:3; padding:4px 10px 6px; }
    body.has-qr .queue { gap:6px; }
    body.has-qr .qrow { padding:2px 0; }
    body.has-qr .qnow { padding:8px 10px; }
    body.onbreak.has-qr #nxqr { justify-self:center; margin:4px auto 0; }
  }
</style>
</head>
<body class="nature">
<header>
  <span class="dot" id="dot"></span>
  <span id="name">https://fll.nexus/fll/mm26</span>
  <span id="updated" role="status">Last updated --:--</span>
</header>
<main id="main"><div class="waiting">Waiting for the queue…</div></main>
<div id="nxqr" class="hidden"><canvas id="nxqrCanvas"></canvas><div id="nxqrLabel"></div></div>
<script src="/vendor/qrcode.js"></script>
<script src="/vendor/nexus-qr.js"></script>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const $ = id => document.getElementById(id);
  let view = null, failed = false, lastHTML = '';

  function pollMs() {
    const q = Number(new URLSearchParams(location.search).get('poll'));
    return q >= 200 && q <= 30000 ? q : 2000;
  }
  function hm(ms) {
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function showUpdated(v) {
    const el = $('updated');
    const at = v && v.updatedAt;
    if (!at) { el.textContent = 'Last updated --:--'; el.removeAttribute('data-at'); return; }
    el.textContent = 'Last updated ' + hm(at);
    el.setAttribute('data-at', String(at));
    el.classList.toggle('stale', failed);
  }
  function clock(t) {
    if (t == null) return '';
    try { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (e) { return hm(t); }
  }
  function fmt(ms) {
    if (ms == null || !isFinite(ms)) return '-:--';
    const neg = ms < 0;
    const total = Math.ceil(Math.abs(ms) / 1000 - 1e-6);
    return (neg ? '-' : '') + Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }
  function estNow(v) {
    if (!v.serverNow) return Date.now();
    return v.serverNow + (Date.now() - (v.receivedAt || Date.now()));
  }
  function remaining(v) {
    const t = v.timer || {};
    if (t.status === 'paused') return t.remainingAtPause;
    if (t.status === 'done') return 0;
    if (t.status === 'running' && t.startAt != null) return t.startAt + (t.duration || 0) - estNow(v);
    return t.duration;
  }
  const tableName = (v, t) => (v.schedule && v.schedule.tableNames && v.schedule.tableNames[t]) || ('Table ' + t);
  const teamName = (v, n) => (v.schedule && v.schedule.teamNames && v.schedule.teamNames[n]) || '';
  const matchLabel = m => m ? (m.practice ? 'Practice ' : 'Match ') + m.n : '';
  function pairsOf(v, m) {
    const pairs = (v.layout && v.layout.pairs) || [];
    const tables = Object.keys(m.teams || {});
    return pairs.filter(p => (p.tables || []).some(t => tables.includes(String(t)))).map(p => p.id);
  }
  function tablesOf(m) { return Object.keys(m.teams || {}).sort((a, b) => a - b); }

  function queueHtml(v) {
    const sch = v.schedule;
    if (!sch || !sch.matches || !sch.matches.length) return '<div class="waiting">No matches on the queue yet.</div>';
    const st = v.timer || {}, mm = v.match || {}, L = sch.matches;
    const brk = st.kind === 'break' && st.status === 'running';
    const text = fmt(remaining(v));
    const liveIdx = (!brk && (st.status === 'running' || st.status === 'paused') && mm.live != null) ? mm.live : null;
    const doneIdx = st.status === 'done' && mm.live != null ? mm.live : null;
    const up = liveIdx != null ? liveIdx + 1 : (doneIdx != null && mm.current === doneIdx) ? doneIdx + 1 : (mm.current || 0);
    // Lunch is the operator's break mode (#75). The sign uses the width of the screen, and names the match
    // the break returns to. That index does not follow the clock, so an early or late break stays on it.
    if (brk && st.lunch) {
      const nxt = L[up];
      const when = nxt && nxt.time != null ? '<div class="brksub">Matches resume at <b>' + esc(clock(nxt.time)) + '</b></div>' : '';
      const back = nxt ? '<div class="qback"><div class="qback-k">When we\'re back</div><div class="qback-match">' + esc(matchLabel(nxt)) + '</div><div class="qback-teams">' + tablesOf(nxt).map(t => { const nm = teamName(v, nxt.teams[t]); return '<div class="qrow"><span class="qt">' + esc(tableName(v, t)) + '</span><span class="qn">' + esc(nxt.teams[t]) + '</span><span class="qname" title="' + esc(nm) + '">' + esc(nm) + '</span></div>'; }).join('') + '</div></div>' : '';
      return '<div class="queue qbreak"><div class="qbreak-card"><div class="qbreak-top"><div class="brkpill">Lunch</div><div class="qbreak-on">On a break</div></div><div class="qtime">' + esc(text) + '</div>' + when + back + '</div></div>';
    }
    const teamsInline = m => tablesOf(m).map(t => '<span class="t"><small>' + esc(tableName(v, t)) + '</small> ' + esc(m.teams[t]) + '</span>').join(' ');
    let now;
    if (liveIdx != null && L[liveIdx]) now = '<span class="k">Now playing</span><b>' + esc(matchLabel(L[liveIdx])) + '</b> ' + teamsInline(L[liveIdx]) + '<span class="clock">' + esc(text) + '</span>';
    else if (brk) { const nxt = L[up]; const at = nxt && nxt.time != null ? clock(nxt.time) : ''; now = '<span class="k brk">' + esc(st.lunch ? 'Lunch' : 'Field break') + '</span>' + (at ? '<span>next match at <b>' + esc(at) + '</b></span>' : '') + '<span class="clock">' + esc(text) + '</span>'; }
    else if (doneIdx != null && L[doneIdx]) now = '<span class="k dim">Finished</span><b>' + esc(matchLabel(L[doneIdx])) + '</b> ' + teamsInline(L[doneIdx]);
    else now = '<span class="k dim">Field ready</span><span class="muted">waiting for the next match</span>';
    const card = (m, i) => m ? '<div class="qcard' + (i === 0 ? ' first' : '') + '"><div class="qhead"><span class="k">' + (i === 0 ? 'Next' : 'Then') + '</span><span>' + esc(matchLabel(m)) + '</span><span class="pr">' + esc(pairsOf(v, m).map(p => 'PAIR ' + p).join(' + ')) + '</span><span class="tm">' + esc(clock(m.time)) + '</span></div><div class="qrows">' + tablesOf(m).map(t => '<div class="qrow"><span class="qt">' + esc(tableName(v, t)) + '</span><span class="qn">' + esc(m.teams[t]) + '</span><span class="qname">' + esc(teamName(v, m.teams[t])) + '</span></div>').join('') + '</div></div>'
      : '<div class="qcard"><div class="qhead"><span class="k">' + (i === 0 ? 'Next' : 'Then') + '</span><span class="muted">No more matches</span></div></div>';
    const qn = v.display && v.display.queueCount != null ? v.display.queueCount : 2;
    const qd = [];
    for (let i = up + 2; i < Math.min(L.length, up + 2 + qn); i++) qd.push(L[i]);
    const queued = qn > 0 ? '<div class="qbox qqueue"><div><span class="k">Queuing soon...</span>' + (qd.length ? '' : '<span class="muted">nothing else scheduled</span>') + '</div>' + qd.map(m => '<div class="ln"><b>' + esc(matchLabel(m)) + '</b><span class="tm2">' + esc(clock(m.time)) + '</span>' + tablesOf(m).map(t => '<span>' + esc(m.teams[t]) + (teamName(v, m.teams[t]) ? ' ' + esc(teamName(v, m.teams[t])) : '') + '</span>').join(' ') + '</div>').join('') + '</div>' : '';
    return '<div class="queue"><div class="qbox qnow">' + now + '</div><div class="qnext">' + card(L[up], 0) + card(L[up + 1], 1) + '</div>' + queued + '</div>';
  }

  const QR_LABEL = 'Scan for rankings and score breakdowns';
  const DEFAULT_QR = 'https://fll.nexus/region/fll/event/mm26/leaderboard';
  const DEFAULT_CORNER = 'https://fll.nexus/fll/mm26';
  let qrDrawn = '';
  function paintQr() {
    const d = view && view.display;
    const link = d && typeof d.cornerLink === 'string' ? d.cornerLink : DEFAULT_CORNER;
    const nameEl = $('name');
    if (nameEl.textContent !== link) nameEl.textContent = link;
    const url = (d && typeof d.qrUrl === 'string' ? d.qrUrl : (view ? DEFAULT_QR : '')).trim();
    const box = $('nxqr');
    const label = $('nxqrLabel');
    if (!url) {
      box.classList.add('hidden');
      document.body.classList.remove('has-qr');
      if (label.textContent) label.textContent = '';
      return;
    }
    if (qrDrawn === 'fail:' + url) {
      box.classList.add('hidden');
      document.body.classList.remove('has-qr');
      if (label.textContent) label.textContent = '';
      return;
    }
    if (qrDrawn !== url) {
      try {
        drawNexusQr($('nxqrCanvas'), url);
        qrDrawn = url;
      } catch (e) {
        console.warn('QR code could not be drawn: ' + (e && e.message || e));
        qrDrawn = 'fail:' + url;
        box.classList.add('hidden');
        document.body.classList.remove('has-qr');
        label.textContent = '';
        return;
      }
    }
    if (label.textContent !== QR_LABEL) label.textContent = QR_LABEL;
    box.classList.remove('hidden');
    document.body.classList.add('has-qr');
  }
  function render() {
    document.body.classList.toggle('nature', !view || !view.display || view.display.theme !== 'plain');
    const onBreak = !!(view && view.timer && view.timer.kind === 'break' && view.timer.status === 'running' && view.timer.lunch);
    document.body.classList.toggle('onbreak', onBreak);
    $('dot').className = 'dot' + (view ? (failed ? ' wait' : ' ok') : '');
    showUpdated(view);
    if (!view) { if (failed) $('main').innerHTML = '<div class="waiting">Waiting for the queue…</div>'; return; }
    const html = queueHtml(view);
    if (html !== lastHTML) { $('main').innerHTML = html; lastHTML = html; }
    paintQr();
  }

  async function poll() {
    try {
      const r = await fetch('/queue.json', { cache: 'no-store', signal: AbortSignal.timeout(4000) });
      if (!r.ok) throw new Error(String(r.status));
      const data = await r.json();
      if (!data || typeof data !== 'object' || !data.timer) throw new Error('bad');
      data.receivedAt = Date.now();
      view = data;
      failed = false;
    } catch (e) {
      failed = true;
    }
    render();
  }
  poll();
  setInterval(poll, pollMs());
  setInterval(() => { if (view && view.timer && view.timer.status === 'running') render(); }, 500);
})();
</script>
</body>
</html>
