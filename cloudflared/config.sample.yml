# Copy this file to cloudflared/config.yml (that copy is gitignored) and fill in
# tunnel + credentials-file. Do not point the tunnel at the match timer.
#
# The hostname below is the example for this event. It must match QUEUE_HOSTNAME.
# If QUEUE_HOSTNAME is unset and this file is the live config, the timer uses the
# same documented default: queue.kippykiyay.com.
#
# ingress: this hostname only, then a catch-all 404. No other public route.

tunnel: TUNNEL_UUID
credentials-file: ~/.cloudflared/TUNNEL_UUID.json

ingress:
  - hostname: queue.kippykiyay.com
    service: http://127.0.0.1:8081
  - service: http_status:404
